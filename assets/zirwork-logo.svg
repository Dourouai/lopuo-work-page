    <path data-letter="O" d="M1265 18c60 0 102 44 102 104.5S1325 227 1265 227s-102-44-102-104.5S1205 18 1265 18Zm0 36c-36 0-61 27-61 68.5s25 68.5 61 68.5 61-27 61-68.5S1301 54 1265 54Z" />
    <path data-letter="R" d="M1400 18h100c55 0 87 33 87 81 0 37-21 63-59 75l71 53h-59l-69-49h-32v49h-39V18Zm39 36v89h57c31 0 51-17 51-44 0-27-20-45-51-45h-57Z" />
    <path data-letter="K" d="M1620 18h40v82l82-82h52l-96 100 108 109h-54l-92-92v92h-40V18Z" />
  </g>
</svg>
