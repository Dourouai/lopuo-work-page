<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1829 243"
  role="img"
  aria-labelledby="zirwork-logo-title zirwork-logo-desc"
  preserveAspectRatio="xMidYMid meet"
  focusable="false"
>
  <title id="zirwork-logo-title">ZIRWORK logo</title>
  <desc id="zirwork-logo-desc">The ZIRWORK geometric mark beside a custom uppercase wordmark.</desc>

  <!-- The two-piece mark is the approved Option A silhouette. Its visible height is 209px,
       matching the cap height of the custom wordmark below. -->
  <g id="zirwork-mark" aria-hidden="true">
    <path fill="#063C32" d="M70 18h165l-66 89H2l68-89Z" />
    <path fill="#A6D94A" d="M70 145h97l68-87v89l-68 80H0l70-82Z" />
  </g>

